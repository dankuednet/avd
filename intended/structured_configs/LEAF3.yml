aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet53
  description: L2_SPINE1_Ethernet27
  shutdown: false
  channel_group:
    id: 53
    mode: active
  peer: SPINE1
  peer_interface: Ethernet27
  peer_type: l2spine
- name: Ethernet54
  description: L2_SPINE2_Ethernet27
  shutdown: false
  channel_group:
    id: 53
    mode: active
  peer: SPINE2
  peer_interface: Ethernet27
  peer_type: l2spine
- name: Ethernet1
  description: RACK1 Access Port
  shutdown: false
  poe:
    priority: critical
    reboot:
      action: maintain
    link_down:
      action: maintain
    shutdown:
      action: power-off
    limit:
      class: 4
  dot1x:
    port_control: auto
    reauthentication: true
    pae:
      mode: authenticator
    authentication_failure:
      action: allow
      allow_vlan: 90
    host_mode:
      mode: multi-host
      multi_host_authenticated: true
    mac_based_authentication:
      enabled: true
    timeout:
      reauth_period: server
      tx_period: 3
    reauthorization_request_limit: 3
  spanning_tree_bpduguard: enabled
  spanning_tree_portfast: edge
  peer_type: network_port
  port_profile: PP-DOT1X
  switchport:
    enabled: true
    mode: trunk phone
    trunk:
      native_vlan: 1
    phone:
      vlan: 40
      trunk: untagged
