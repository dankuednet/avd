!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$eucN5ngreuExDgwS$xnD7T8jO..GBDX0DUlp.hn.W7yW94xTjSanqgaQGBzPIhDAsyAl9N4oScHvOMvf07uVBFI4mKMxwdVEUVKgY/.
username arista privilege 15 role network-admin nopassword
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname LEAF4
ip name-server vrf MGMT 192.168.2.248
ip name-server vrf MGMT 192.168.2.249
!
spanning-tree mode mstp
spanning-tree mst 0 priority 16384
!
vlan 10
   name DATA-NET
!
vlan 20
   name PRN-NET
!
vlan 30
   name VOIP-NET
!
vlan 50
   name MNG-NET
!
vlan 60
   name GUEST-NET
!
vlan 100
   name BLACKHOLE-NET
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authentication policy local allow-nopassword-remote-login
aaa authorization exec default local
!
interface Port-Channel53
   description L2_SPINES_Port-Channel25
   no shutdown
   switchport trunk allowed vlan 10,20,30,50,60,100
   switchport mode trunk
   switchport
!
interface Ethernet1
   description RACK1 Access Port
   no shutdown
   switchport trunk native vlan 1
   switchport phone vlan 40
   switchport phone trunk untagged
   switchport mode trunk phone
   switchport
   poe priority critical
   poe reboot action maintain
   poe link down action maintain
   poe shutdown action power-off
   poe limit 30.00 watts
   spanning-tree portfast
   spanning-tree bpduguard enable
   dot1x pae authenticator
   dot1x authentication failure action traffic allow vlan 90
   dot1x reauthentication
   dot1x port-control auto
   dot1x host-mode multi-host authenticated
   dot1x mac based authentication
   dot1x timeout tx-period 3
   dot1x timeout reauth-period server
   dot1x reauthorization request limit 3
