!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$eucN5ngreuExDgwS$xnD7T8jO..GBDX0DUlp.hn.W7yW94xTjSanqgaQGBzPIhDAsyAl9N4oScHvOMvf07uVBFI4mKMxwdVEUVKgY/.
username arista privilege 15 role network-admin nopassword
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname SPINE2
ip name-server vrf MGMT 192.168.2.248
ip name-server vrf MGMT 192.168.2.249
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 4096
!
vlan 10
   name DATA-NET
!
vlan 20
   name PRN-NET
!
vlan 30
   name VOIP-NET
!
vlan 50
   name MNG-NET
!
vlan 60
   name GUEST-NET
!
vlan 100
   name BLACKHOLE-NET
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authentication policy local allow-nopassword-remote-login
aaa authorization exec default local
!
interface Port-Channel5
   description FIREWALL_FIREWALL
   no shutdown
   switchport trunk allowed vlan 20,30,40,50,60,80,110
   switchport mode trunk
   switchport
   mlag 5
!
interface Port-Channel23
   description L2_LEAF5_Port-Channel53
   no shutdown
   switchport trunk allowed vlan 10,20,30,50,60,100
   switchport mode trunk
   switchport
   mlag 23
!
interface Port-Channel25
   description L2_LEAF4_Port-Channel53
   no shutdown
   switchport trunk allowed vlan 10,20,30,50,60,100
   switchport mode trunk
   switchport
   mlag 25
!
interface Port-Channel27
   description L2_LEAF3_Port-Channel53
   no shutdown
   switchport trunk allowed vlan 10,20,30,50,60,100
   switchport mode trunk
   switchport
   mlag 27
!
interface Port-Channel29
   description L2_LEAF2_Port-Channel35
   no shutdown
   switchport trunk allowed vlan 10,20,30,50,60,100
   switchport mode trunk
   switchport
   mlag 29
!
interface Port-Channel31
   description L2_LEAF1_Port-Channel35
   no shutdown
   switchport trunk allowed vlan 10,20,30,50,60,100
   switchport mode trunk
   switchport trunk group MLAG
   switchport
   mlag 31
!
interface Ethernet5
   description FIREWALL_FIREWALL_Eth2
   no shutdown
   channel-group 5 mode active
!
interface Ethernet23
   description L2_LEAF5_Ethernet54
   no shutdown
   channel-group 23 mode active
!
interface Ethernet25
   description L2_LEAF4_Ethernet54
   no shutdown
   channel-group 25 mode active
!
interface Ethernet27
   description L2_LEAF3_Ethernet54
   no shutdown
   channel-group 27 mode active
!
interface Ethernet29
   description L2_LEAF2_Ethernet36
   no shutdown
   channel-group 29 mode active
!
interface Ethernet31
   description L2_LEAF1_Ethernet36
   no shutdown
   channel-group 31 mode active
!
interface Ethernet32
   description MLAG_SPINE1_Ethernet32
   no shutdown
   channel-group 31 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.100.12/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 192.168.0.1/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id SPINES
   local-interface Vlan4094
   peer-address 192.168.0.0
   peer-link Port-Channel31
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route vrf MGMT 0.0.0.0/0 172.16.100.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT ntp.ued.net prefer
!
end
