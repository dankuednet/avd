---
### group_vars/DC1_NETWORK_PORTS.yml

connected_endpoints_keys:
  - key: servers
    type: server
  - key: firewalls
    type: firewall
  - key: routers
    type: router
  # These keys must be defined to be able to use them below.
  - key: printers
    type: printers
  - key: workstations
    type: workstations
  - key: generic_devices
    type: generic_devices
  - key: access_points
    type: access_points

#transceiver_qsfp_default_mode_4x10: false

# TODO: RADIUS server connection and dynamic ports.
port_profiles:
  - profile: PP-DEFAULTS
    spanning_tree_portfast: edge
    # General Data.
  - profile: PP-DATA
    mode: access
    vlans: "20"
    parent_profile: PP-DEFAULTS
    # Printers and scanners.
  - profile: PP-PRN
    mode: access
    vlans: "30"
    parent_profile: PP-DEFAULTS
    # VOIP Telephone devices.
  - profile: PP-VOIP
    mode: access
    vlans: "40"
    parent_profile: PP-DEFAULTS
    # Video like security cameras.
  - profile: PP-VIDEO
    mode: access
    vlans: "50"
    parent_profile: PP-DEFAULTS
    # Wi-Fi Access Points
  - profile: PP-AP
    mode: access
    vlans: "60"
    parent_profile: PP-DEFAULTS
    # Guest is outbound only, no access to internal devices.
  - profile: PP-GUEST
    mode: access
    vlans: "80"
    parent_profile: PP-DEFAULTS
    # Black hole to block unkown devices.
  - profile: PP-BLACKHOLE
    mode: access
    vlans: "90"
    parent_profile: PP-DEFAULTS
    # Management network for IT devices.
  - profile: PP-MNG
    mode: access
    vlans: "100"
    parent_profile: PP-DEFAULTS
    # Vertical Lift Module devices.
  - profile: PP-VLM
    mode: access
    vlans: "110"
    parent_profile: PP-DEFAULTS
    # Workstations that need VOIP and General Data.
  - profile: PP-WS
    mode: trunk
    vlans: "20,40"
    parent_profile: PP-DEFAULTS
    # Server VLANs Default(for now), Data, VOIP, Video (needed?)
    # TODO: Remove vlan=1 later.
  - profile: PP-SVR
    mode: trunk
    vlans: "1,20,40,110"
    parent_profile: PP-DEFAULTS
    # Firewall for routing between VLANs
  - profile: PP-FIREWALL
    mode: trunk
    vlans: "20,30,40,50,60,80,110"
    # Phone 802.1X Authentication
  - profile: PP-DOT1X
    mode: "trunk phone"
    spanning_tree_portfast: edge
    spanning_tree_bpduguard: enabled
    poe:
      priority: critical
      reboot:
        action: maintain
      link_down:
        action: maintain
      shutdown:
        action: power-off
      limit:
        class: 4
    dot1x:
      port_control: auto
      reauthentication: true
      pae:
        mode: authenticator
      host_mode:
        mode: multi-host
        multi_host_authenticated: true
      mac_based_authentication:
        enabled: true
      timeout:
        reauth_period: server
        tx_period: 3
      reauthorization_request_limit: 3

