printers:
  - name: PRN2
    rack: RACK1
    adapters:
      - endpoint_ports: [Eth1]
        switch_ports: [Ethernet5]
        switches: [LEAF4]
        profile: PP-PRN
        
firewalls:
  - name: FIREWALL
    adapters:
      - endpoint_ports: [Eth1, Eth2]
        switch_ports: [Ethernet5, Ethernet5]
        switches: [SPINE1, SPINE2]
        profile: PP-FIREWALL
        port_channel:
          mode: active


network_ports:
# ---------------- RACK1 ----------------
  - switches:
      - LEAF[345] # regex match LEAF3 & LEAF4 & LEAF5
    switch_ports:
      - Ethernet1-48
    description: RACK1 Access Port
    profile: PP-DOT1X
    native_vlan: 1
    structured_config:
      switchport:
        phone:
          trunk: untagged
          vlan: 40
    dot1x:
      authentication_failure:
        action: allow
        allow_vlan: 90

#  - switches:
#      - LEAF[345] # regex match LEAF3 & LEAF4 & LEAF5
#    switch_ports:
#      - Ethernet33-36
#    description: RACK1 QSFP Port
#    transceiver_qsfp_default_mode_4x10: false

# ---------------- RACK1 ToR ----------------
    # Start by turning ALL ToR switch ports off.
  - switches:
      - LEAF[12]
    switch_ports:
       - Ethernet1-32
    description: RACK1 ToR Port
    enabled: false
    # Turn on ToR switch ports to be used.
  - switches:
      - LEAF[12]
    switch_ports:
       # All odd numberd ports 17-31 are for servers.
       # Could not find a Regex sequence for odd numbered ports.
       - Ethernet17
       - Ethernet19
       - Ethernet21
       - Ethernet23
       - Ethernet25
       - Ethernet27
       - Ethernet29
       - Ethernet31
       #- Ethernet1-16
       #- Ethernet17-24
       # Example: Ethernet3/44 Ethernet3/45 ...
       #- Ethernet3-7/1-48
       # Doesn't work for 21-29 odd.
       #- Ethernet2[13579]
       #- Ethernet[2][13579]
       #- Ethernet{2}[13579]
       
    description: RACK1 ToR Port
    profile: PP-SVR

# ---------------- IDF1 ----------------
  - switches:
      - LEAF6
    switch_ports:
      - Ethernet1-48
